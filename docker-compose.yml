# Local development services. Run: docker compose up -d
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: account_gold
      MYSQL_USER: account_gold
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  mailpit: # catches outgoing email (password resets, notifications) at http://localhost:8025
    image: axllent/mailpit:v1.20
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  mysql-data:
